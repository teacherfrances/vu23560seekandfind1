<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find It On The Screen</title>
<style>
:root{
  --navy:#0b2e4f; --teal:#0f7d7d; --tealD:#0b5f5f; --tealT:#e4f2f2;
  --amber:#c97a1a; --amberPill:#f7dc9a; --green:#1c7a3e; --greenT:#e7f4ec;
  --red:#b3261e; --card:rgba(255,255,255,.94); --line:#dfe3e0; --grey:#5a6772;
  --disp:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --pz:1; --ui:clamp(25px,6.3vw,38px); --tx:0px; --ty:0px; --ry:-6deg; --rx:1.6deg; --sw:230vw;
}
*{box-sizing:border-box}
button,select{font-size:1em;font-family:inherit;color:inherit}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--body);font-size:var(--ui);color:var(--navy);
  background:#20303c;overflow-x:hidden;-webkit-text-size-adjust:100%}
.disp{font-family:var(--disp);font-weight:900}

/* the room behind everything */
.room{position:fixed;inset:0;z-index:0;overflow:hidden}
.room svg{width:100%;height:100%;display:block;filter:blur(1.5px) saturate(.9)}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#111}
.room.live #cam{display:block}
.room.live svg{display:none}
.room.live::after{background:linear-gradient(180deg,rgba(10,20,28,.06),rgba(10,20,28,.20))}
.room::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,28,.18),rgba(10,20,28,.42))}

#app{position:relative;z-index:3;min-height:100%;padding:.5em .5em .8em;
  display:flex;flex-direction:column;align-items:center;pointer-events:none}
#app>*{pointer-events:auto}

/* floating pills */
.pill{position:fixed;top:.5em;z-index:6;background:rgba(255,255,255,.95);border:0;border-radius:18px;
  font-family:var(--disp);font-weight:900;color:var(--navy);font-size:1em;
  padding:.42em .9em;box-shadow:0 8px 22px rgba(0,0,0,.34);cursor:pointer;
  min-height:1.7em;display:flex;align-items:center;gap:.3em}
.pill.left{left:.5em} .pill.right{right:.5em}
.pill .ico{color:var(--teal);font-size:1.1em;line-height:1}
.pill:active{background:#eef4f7}

/* the scene, hung on the wall */
.arlayer{position:fixed;inset:0;overflow:hidden;z-index:1;perspective:1600px;touch-action:none;cursor:grab}
.arlayer.dragging{cursor:grabbing}
.panel{position:absolute;left:50%;top:34%;width:var(--sw);
  transform:translate(-50%,-50%) translate3d(var(--tx),var(--ty),0) rotateY(var(--ry)) rotateX(var(--rx)) scale(var(--pz));
  transform-origin:50% 50%;will-change:transform}
.panel.shake{animation:sh .34s}
@keyframes sh{0%,100%{filter:none}30%{filter:brightness(1.25) saturate(.6)}70%{filter:brightness(.9)}}
.stage{position:relative;border-radius:8px;overflow:hidden;
  box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 5px rgba(255,255,255,.72);touch-action:manipulation}
.stage svg{display:block;width:100%;height:auto}
[data-hit]{cursor:pointer}
.edge{position:fixed;top:34%;z-index:6;background:rgba(255,255,255,.82);border:0;border-radius:18px;
  font-family:var(--disp);font-weight:900;color:var(--navy);font-size:.7em;padding:.35em .65em;
  box-shadow:0 8px 22px rgba(0,0,0,.34);display:none;align-items:center;gap:.25em;pointer-events:none}
.edge.show{display:flex;animation:eg 1.1s ease-in-out infinite}
.edge.l{left:.5em} .edge.r{right:.5em}
@keyframes eg{0%,100%{opacity:.65}50%{opacity:1}}
.ring{position:absolute;border:7px solid #ffd166;border-radius:999px;pointer-events:none;animation:rg .95s ease-out forwards}
@keyframes rg{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.55);opacity:0}}
.hintpulse{position:absolute;border:8px dashed #ffd166;border-radius:20px;pointer-events:none;animation:hp 1s ease-in-out 3}
@keyframes hp{0%,100%{opacity:.25}50%{opacity:1}}

/* the sheet */
.sheet{width:100%;max-width:1180px;background:var(--card);position:relative;z-index:3;border-radius:28px;
  box-shadow:0 14px 40px rgba(0,0,0,.34);padding:.5em .7em .55em;margin:auto .5em .5em}
.sheet.menu{margin-top:2.6em}
.lab{font-family:var(--disp);font-weight:900;color:#7d8794;font-size:.6em;
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:.2em}
.clue{display:block;background:var(--amberPill);border-radius:16px;
  font-family:var(--disp);font-weight:900;color:var(--navy);font-size:1.12em;
  padding:.32em .7em;line-height:1.2}
.clue.done{background:var(--greenT);color:var(--green)}
.found{font-family:var(--disp);font-weight:900;color:#7d8794;font-size:.78em;margin-top:.3em}
.say{font-size:.76em;line-height:1.3;color:var(--grey);margin-top:.15em;min-height:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.say.good{color:#14532b} .say.good b{color:var(--green);font-family:var(--disp);font-weight:900}
.say.bad{color:#7a1d17;font-weight:700}

.topline{width:100%;max-width:1180px;display:flex;align-items:center;gap:.5em;
  position:absolute;top:.5em;left:50%;transform:translateX(-50%);padding:0 .7em}
.brand{font-family:var(--disp);font-weight:900;color:#fff;font-size:.92em;
  text-shadow:0 2px 10px rgba(0,0,0,.6);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pillcount{background:rgba(255,255,255,.95);border-radius:999px;padding:.22em .85em;
  font-family:var(--disp);font-weight:900;font-size:.9em;color:var(--navy)}

/* controls */
.ctrls{display:flex;flex-wrap:wrap;gap:.35em;align-items:center}
.ctl{border:0;border-radius:16px;background:#eef1f3;color:var(--navy);font-family:var(--disp);
  font-weight:900;font-size:.86em;padding:.3em .62em;min-height:1.5em;cursor:pointer;line-height:1.2}
.ctl.blue{background:#dceaf6;color:#134a75}
.ctl.go{background:var(--teal);color:#fff}
.ctl.warnbtn{background:var(--amber);color:#fff}
.ctl:active{filter:brightness(.94)}
.stepper{display:inline-flex;align-items:center;background:#fff;border:2px solid var(--line);
  border-radius:14px;overflow:hidden;min-height:1.55em}
.sbtn{border:0;background:#fff;font-size:1.1em;font-weight:900;color:var(--navy);
  width:1.35em;min-height:1.4em;cursor:pointer;font-family:var(--disp)}
.sbtn:active{background:#eef1f3}
.skey{font-family:var(--disp);font-weight:900;font-size:.86em;padding:0 .2em;min-width:2.4em;text-align:center}

/* menu cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.55em}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:.1em;text-align:left;
  background:#fff;border:2px solid var(--line);border-left:12px solid var(--teal);
  border-radius:20px;padding:.7em .85em;cursor:pointer;font-family:var(--body);font-size:1em}
.mcard.done{border-left-color:var(--green);background:#f4fbf6}
.mcard:active{background:var(--tealT)}
.mstep{color:var(--amber);font-family:var(--disp);font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;font-size:.64em}
.mtitle{font-family:var(--disp);font-weight:900;color:var(--navy);font-size:1em;line-height:1.15}
.mdesc{color:var(--grey);font-size:.78em;line-height:1.3}
.score{margin-top:.35em;background:#eef1f3;border-radius:999px;padding:.18em .8em;
  font-family:var(--disp);font-weight:900;font-size:.78em;color:var(--navy)}
.score.done{background:var(--greenT);color:var(--green)}
.note{color:#7d8794;font-size:.86em;margin-top:.45em;line-height:1.3}
.warn{background:#fdf3e0;border:2px solid var(--amber);border-radius:14px;padding:.5em .8em;
  font-size:.84em;color:#7a4a08;margin-bottom:.5em}

/* word list */
.wtitle{font-family:var(--disp);font-weight:900;color:#fff;background:var(--navy);
  border-radius:14px;padding:.34em .8em;font-size:1em;margin:.7em 0 .35em}
.wlist{display:grid;grid-template-columns:1fr;gap:.25em}
.wrow{display:grid;grid-template-columns:minmax(140px,.42fr) 1fr;gap:.5em;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:.35em .6em}
.ww{font-family:var(--disp);font-weight:900;color:var(--navy);font-size:.9em}
.wd{color:var(--grey);font-size:.84em;line-height:1.3}
@media (max-width:620px){
  .wrow{grid-template-columns:1fr}
  .ctrls{gap:.4em}
  .ctl{flex:0 1 auto;text-align:center}
  .stepper{flex:1 1 auto;justify-content:space-between}
  .sheet.play{padding:.45em .6em .5em}
  .sbtn{flex:0 0 auto}
  :root{--ry:-4deg;--rx:1.2deg;--sw:260vw}
  .sheet.menu{margin-top:2.5em}
  .pill{font-size:.92em;min-height:60px}
}
@media (min-width:900px) and (orientation:landscape){
  .sheet.play{position:fixed;right:.6em;bottom:.6em;top:auto;width:min(36vw,560px);
    margin:0;max-height:88vh;overflow:auto}
  .edge.r{right:calc(min(36vw,560px) + 1.4em)}
  .edge{top:46%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- camera, panning and tilt ---------- */
var camOn=false, camStream=null, tiltOn=false;
var yaw0=null, pit0=null, panX=0, panY=0, limX=0, limY=0;
var VIS={l:0,t:0,r:0,b:0};
function setVar(k,v){ document.documentElement.style.setProperty(k,v); }
function camMsg(t){ var s=el("say"); if(s){ s.className="say"; s.textContent=t; } }
function syncCam(){ var b=el("bCam"); if(b) b.textContent = camOn ? "Camera off" : "Camera"; }

var ASPECT=1200/700;
function measure(){
  var ar=el("ar"), pn=el("panel");
  if(!ar||!pn){ limX=0; limY=0; return; }
  var a=ar.getBoundingClientRect();
  var sh=document.querySelector(".sheet.play");
  var r=sh?sh.getBoundingClientRect():null;
  var sideCard = !!(r && r.left > a.width*0.5 && r.height < a.height*0.92);
  var visW = sideCard ? Math.max(240, r.left-12) : a.width;
  var visH = sideCard ? a.height : Math.max(180, a.height-(r?r.height:0));
  /* a poster on the wall: it keeps its shape and fits the view, like the camera picture */
  var sw = Math.min(visW*1.20, visH*1.02*ASPECT);
  pn.style.width = Math.round(sw)+"px";
  pn.style.left  = Math.round(visW/2)+"px";
  pn.style.top   = Math.round(visH*0.50)+"px";
  VIS={l:0,t:0,r:visW,b:visH};
  var p=pn.getBoundingClientRect();
  /* the picture is fixed to the wall, so it may travel right out of the frame */
  limX=visW*1.30;
  limY=visH*0.85;
}
function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function setPan(x,y){
  panX=clamp(x,-limX,limX); panY=clamp(y,-limY,limY);
  setVar("--tx",panX.toFixed(1)+"px");
  setVar("--ty",panY.toFixed(1)+"px");
  showEdges();
}
function showEdges(){
  var l=el("edgeL"), r=el("edgeR"), pn=el("panel");
  if(!l||!r||!pn) return;
  var b=pn.getBoundingClientRect();
  var offLeft  = b.right < VIS.l+40;
  var offRight = b.left  > VIS.r-40;
  l.className="edge l"+(offLeft ? " show":"");
  r.className="edge r"+(offRight ? " show":"");
}

/* device movement pans the picture, so it stays put on the wall */
function onOrient(e){
  var yaw = (typeof e.alpha==="number") ? e.alpha : null;
  var pit = (typeof e.beta==="number") ? e.beta : null;
  if(yaw===null && pit===null) return;
  if(yaw0===null){ yaw0=yaw; pit0=pit; return; }
  var dy=0;
  if(yaw!==null){ dy=yaw-yaw0; if(dy>180)dy-=360; if(dy<-180)dy+=360; }
  var dp=(pit!==null&&pit0!==null)?(pit-pit0):0;
  var gx = limX>0 ? limX/32 : 0;      /* about 32 degrees to reach the edge */
  var gy = limY>0 ? limY/26 : 0;
  setPan(dy*gx, -dp*gy);
  setVar("--ry",(-6 - clamp(dy,-20,20)*0.12).toFixed(2)+"deg");
  setVar("--rx",(1.6 + clamp(dp,-20,20)*0.10).toFixed(2)+"deg");
}
function askTilt(){
  if(tiltOn) return;
  var DOE=window.DeviceOrientationEvent;
  if(!DOE) return;
  function on(){ window.addEventListener("deviceorientation",onOrient,true); tiltOn=true; }
  if(typeof DOE.requestPermission==="function"){
    DOE.requestPermission().then(function(r){ if(r==="granted") on(); }).catch(function(){});
  } else { on(); }
}

/* finger or mouse drag, for a board without sensors */
var dragging=false,sx=0,sy=0,ox=0,oy=0,moved=0;
function bindDrag(){
  var ar=el("ar"); if(!ar) return;
  ar.onpointerdown=function(ev){
    dragging=true; moved=0; sx=ev.clientX; sy=ev.clientY; ox=panX; oy=panY;
    ar.className="arlayer dragging";
    if(ar.setPointerCapture){ try{ ar.setPointerCapture(ev.pointerId); }catch(e){} }
  };
  ar.onpointermove=function(ev){
    if(!dragging) return;
    var dx=ev.clientX-sx, dy=ev.clientY-sy;
    moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    setPan(ox+dx, oy+dy);
  };
  ar.onpointerup=function(ev){
    if(!dragging) return;
    dragging=false; ar.className="arlayer";
    if(moved<14) tapAt(ev.clientX,ev.clientY);
  };
  ar.onpointercancel=function(){ dragging=false; ar.className="arlayer"; };
}

function startCam(){
  var md = navigator.mediaDevices;
  if(!md || !md.getUserMedia){ camMsg("There is no camera on this device. Drag the picture with your finger."); return; }
  md.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(st){
    camStream=st;
    var v=el("cam");
    if(v){ try{ v.srcObject=st; }catch(e){} if(v.play) v.play(); }
    var r=el("room"); if(r) r.className="room live";
    camOn=true; syncCam(); askTilt();
    camMsg("Turn around slowly. The picture stays on the wall.");
  }).catch(function(){
    camMsg("The camera did not open. Drag the picture with your finger.");
  });
}
function stopCam(){
  if(camStream){ var t=camStream.getTracks(),i; for(i=0;i<t.length;i++){ try{t[i].stop();}catch(e){} } }
  camStream=null; camOn=false;
  var r=el("room"); if(r) r.className="room";
  var v=el("cam"); if(v){ try{ v.srcObject=null; }catch(e){} }
  syncCam(); camMsg("Camera off. Drag the picture with your finger.");
}
function toggleCam(){ if(camOn) stopCam(); else startCam(); }

function recentre(){
  yaw0=null; pit0=null;
  setVar("--ry","-6deg"); setVar("--rx","1.6deg");
  measure(); setPan(0,0);
  camMsg("The picture is back in the middle.");
}

function promptFor(p){
  if(p<SCENES.length){
    var sc=SCENES[p],i,t;
    for(i=0;i<S.order.length;i++){ t=sc.T[S.order[i]]; if(!isFound(p,t.id)) return {id:t.id,txt:"Find "+t.w+".",why:t.why,w:t.w,scene:sc}; }

  advanceMix();
  if(S.idx>=S.order.length) return null;
  var m=MIX[S.order[S.idx]], sc2=sceneById(m[0]), tg=targetById(sc2,m[1]);
  return {id:tg.id,txt:tg.c,why:tg.why,w:tg.w,scene:sc2};
}

/* ---------- render ---------- */
function render(){
  applySize();
  var app=el("app");
  if(S.view==="menu"){ app.innerHTML=viewMenu(); bindMenu(); return; }
  if(S.view==="words"){ app.innerHTML=viewWords(); bindWords(); return; }
  app.innerHTML=viewPlay(); bindPlay(); syncCam();
}

function viewMenu(){
  var h='<div class="topline"><span class="brand">Find It On The Screen</span>'+
        '<span class="pillcount">'+totalFound()+' / '+TOTAL+'</span></div>';
  h+='<div class="sheet menu">';
  h+='<div class="lab">Choose a scene</div>';
  if(!canSave) h+='<div class="warn">This page cannot save here. Everything still works.</div>';
  h+='<div class="mgrid">';
  var i,sc,n,t;
  for(i=0;i<PARTS;i++){
    sc = i<SCENES.length ? SCENES[i] : {step:"Last round",title:"Find the clue",desc:"Read the clue. Work out the word."};
    n=foundIn(i); t=partTotal(i);
    h+='<button class="mcard'+(n===t?" done":"")+'" data-part="'+i+'">';
    h+='<span class="mstep">'+esc(sc.step)+'</span>';
    h+='<span class="mtitle">'+esc(sc.title)+'</span>';
    h+='<span class="mdesc">'+esc(sc.desc)+'</span>';
    h+='<span class="score'+(n===t?" done":"")+'">Found '+n+'/'+t+'</span>';
    h+='</button>';
  }
  h+='</div>';
  h+='<div class="lab" style="margin-top:.7em">Controls</div><div class="ctrls">';
  h+='<button class="ctl blue" id="bWords">Word list</button>';
  h+='<button class="ctl" id="bFull">Full screen</button>';
  h+=stepperHTML();
  h+='</div>';
  h+='<div class="note">Turn the camera on inside a scene. It needs a web address, not a file.</div>';
  if(totalFound()>0) h+='<div style="margin-top:.6em"><button class="ctl" id="bReset">Start again</button></div>';
  h+='</div>';
  return h;
}
function bindMenu(){
  var c=document.querySelectorAll(".mcard"),i;
  for(i=0;i<c.length;i++){ c[i].onclick=(function(n){return function(){ go("play",n); };})(parseInt(c[i].getAttribute("data-part"),10)); }
  el("bWords").onclick=function(){ go("words"); };
  bindCommon();
  var r=el("bReset"); if(r){ var armed=false; r.onclick=function(){
    if(!armed){ armed=true; r.textContent="Tap again to clear"; r.className="ctl warnbtn"; return; }
    S.found={}; save(); go("menu"); }; }
}

function stepperHTML(){
  return '<span class="stepper"><button class="sbtn" id="bMinus">&#8722;</button>'+
         '<span class="skey">'+SIZES[szi].k+'</span>'+
         '<button class="sbtn" id="bPlus">+</button></span>';
}
function bindCommon(){
  var m=el("bMinus"),p=el("bPlus"),f=el("bFull");
  if(m) m.onclick=function(){ if(szi>0){szi--; render(); measure(); setPan(panX,panY);} };
  if(p) p.onclick=function(){ if(szi<SIZES.length-1){szi++; render(); measure(); setPan(panX,panY);} };
  if(f) f.onclick=function(){
    if(document.fullscreenElement){ if(document.exitFullscreen)document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
  };
}

function viewPlay(){
  var p=S.part, pr=promptFor(p), n=foundIn(p), t=partTotal(p);
  var sc = pr ? pr.scene : (p<SCENES.length?SCENES[p]:sceneById(MIX[0][0]));
  var h='';
  h+='<button class="pill left" id="bHome"><span class="ico">&#8249;</span> Home</button>';
  h+='<button class="pill right" id="bHint"><span class="ico">&#9678;</span> Hint</button>';
  h+='<div class="arlayer" id="ar"><div class="panel" id="panel"><div class="stage" id="stage">'+sc.art()+'</div></div></div>';
  h+='<div class="edge l" id="edgeL">\u2039 picture</div><div class="edge r" id="edgeR">picture \u203A</div>';
  h+='<div class="sheet play">';
  h+='<div class="lab">Find this</div>';
  if(pr){ h+='<div class="clue" id="clue">'+esc(pr.txt)+'</div>'; }
  else { h+='<div class="clue done">All '+t+' found. Well done.</div>'; }
  h+='<div class="found">Found '+n+'/'+t+'</div>';
  h+='<div class="say" id="say"></div>';
  if(!pr){
    h+='<div class="ctrls" style="margin-top:.4em">';
    h+= (p<PARTS-1) ? '<button class="ctl go" id="bNextScene">Next scene</button>'
                    : '<button class="ctl go" id="bNextScene">See the word list</button>';
    h+='<button class="ctl" id="bHome2">Home</button></div>';
  } else {
    h+='<div class="lab" style="margin-top:.35em">Controls</div><div class="ctrls">';
    h+='<button class="ctl blue" id="bCam">Camera</button>';
    h+='<button class="ctl" id="bRecenter">Centre</button>';
    h+=stepperHTML();
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function bindPlay(){
  el("bHome").onclick=function(){ go("menu"); };
  var hb=el("bHint"); if(hb) hb.onclick=doHint;
  bindDrag(); measure(); setPan(panX,panY);
  var rc=el("bRecenter"); if(rc) rc.onclick=recentre;
  var cb=el("bCam"); if(cb) cb.onclick=toggleCam;
  var ns=el("bNextScene"); if(ns) ns.onclick=function(){
    if(S.part<PARTS-1){ go("play",S.part+1); } else { go("words"); } };
  var h2=el("bHome2"); if(h2) h2.onclick=function(){ go("menu"); };
  bindCommon();
}

/* ---------- tapping ---------- */
function nearTarget(cx,cy,id,pad){
  var stage=el("stage"); if(!stage) return false;
  var n=stage.querySelector('[data-hit="'+id+'"]'); if(!n) return false;
  var r=n.getBoundingClientRect(); pad=pad||44;
  return cx>=r.left-pad && cx<=r.right+pad && cy>=r.top-pad && cy<=r.bottom+pad;
}
/* geometric hit test: the last matching box wins, so it does not depend on paint order */
function hitAtPoint(cx,cy){
  var stage=el("stage"); if(!stage) return null;
  var ns=stage.querySelectorAll("[data-hit]"), i, r, best=null;
  for(i=0;i<ns.length;i++){
    r=ns[i].getBoundingClientRect();
    if(cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom) best=ns[i];
  }
  return best;
}
function tapAt(cx,cy){
  var stage=el("stage"); if(!stage) return;
  var n=hitAtPoint(cx,cy), id = n ? n.getAttribute("data-hit") : null;
  var pr0=promptFor(S.part);
  if(pr0 && id!==pr0.id && nearTarget(cx,cy,pr0.id)){ id=pr0.id; }
  var p=S.part, pr=promptFor(p);
  if(!pr) return;
  if(!id){ miss("Nothing is there. Look again."); return; }
  if(id!==pr.id){
    if(p<SCENES.length && isFound(p,id)){ miss("You found that one already."); return; }
    miss("Not that one. Look again.");
    return;
  }
  if(p<SCENES.length){ markFound(p,pr.id); }
  else { var m=MIX[S.order[S.idx]]; markFound(PARTS-1,m[0]+":"+m[1]); S.idx++; }
  ping(stage.querySelector('[data-hit="'+pr.id+'"]'));
  var msg='<b>'+esc(pr.w)+'</b> '+esc(pr.why);
  render();
  var s=el("say"); if(s){ s.className="say good"; s.innerHTML=msg; }
}
function miss(t){
  var s=el("say"); if(s){ s.className="say bad"; s.textContent=t; }
  var pn=el("stage"); if(pn){ pn.className="stage shake"; setTimeout(function(){ pn.className="stage"; },340); }
}
/* the scene is rotated, so overlays must be placed in the picture's own coordinates */
function localBox(node){
  var stage=el("stage"); if(!stage||!node) return null;
  var k=stage.clientWidth/1200;
  var x=parseFloat(node.getAttribute("x")||"0"), y=parseFloat(node.getAttribute("y")||"0");
  var w=parseFloat(node.getAttribute("width")||"0"), h=parseFloat(node.getAttribute("height")||"0");
  return {l:x*k, t:y*k, w:w*k, h:h*k};
}
function ping(node){
  var stage=el("stage"); if(!stage||!node)return;
  var b=localBox(node); if(!b) return;
  var d=document.createElement("div"); d.className="ring";
  var w=Math.max(b.w,b.h)*1.15;
  d.style.left=(b.l+b.w/2-w/2)+"px";
  d.style.top=(b.t+b.h/2-w/2)+"px";
  d.style.width=w+"px"; d.style.height=w+"px";
  stage.appendChild(d);
  setTimeout(function(){ if(d.parentNode)d.parentNode.removeChild(d); },950);
}
function doHint(){
  var pr=promptFor(S.part); if(!pr)return;
  var stage=el("stage"); if(!stage)return;
  var node=stage.querySelector('[data-hit="'+pr.id+'"]'); if(!node)return;
  var b=node.getBoundingClientRect();
  var cx=b.left+b.width/2, cy=b.top+b.height/2;
  var ax=(VIS.l+VIS.r)/2, ay=(VIS.t+VIS.b)/2;
  setPan(panX+(ax-cx), panY+(ay-cy));
  b=node.getBoundingClientRect();
  var lb=localBox(node); if(!lb) return;
  var d=document.createElement("div"); d.className="hintpulse";
  d.style.left=(lb.l-16)+"px"; d.style.top=(lb.t-16)+"px";
  d.style.width=(lb.w+32)+"px"; d.style.height=(lb.h+32)+"px";
  stage.appendChild(d);
  setTimeout(function(){ if(d.parentNode)d.parentNode.removeChild(d); },3200);
  var sa=el("say"); if(sa){ sa.className="say"; sa.textContent="Look inside the orange box."; }
}

/* ---------- word list ---------- */
function viewWords(){
  var h='<div class="topline"><span class="brand">All the words</span><span class="pillcount">'+totalFound()+' / '+TOTAL+'</span></div>';
  h+='<div class="sheet menu">';
  h+='<div class="lab">Say each word. Then say where it is.</div>';
  var i,j,sc,t;
  for(i=0;i<SCENES.length;i++){ sc=SCENES[i];
    h+='<div class="wtitle">'+esc(sc.title)+'</div><div class="wlist">';
    for(j=0;j<sc.T.length;j++){ t=sc.T[j];
      h+='<div class="wrow"><span class="ww">'+esc(t.w)+'</span><span class="wd">'+esc(t.why)+'</span></div>'; }
    h+='</div>';
  }
  h+='<div class="ctrls" style="margin-top:.7em"><button class="ctl go" id="bHome3">Home</button>'+stepperHTML()+'</div>';
  h+='</div>';
  return h;
}
function bindWords(){ el("bHome3").onclick=function(){ go("menu"); }; bindCommon(); }

/* keyboard help for teacher on a laptop */
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ go("menu"); }
});

go("menu");
})();
</script>
